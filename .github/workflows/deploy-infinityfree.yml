name: 🚀 Deploy via FTP

on:
  push:
    branches:
      - staging
      - main
      - tbtayo

env:
  # Shared Account Credentials from your screenshots
  FTP_USER: if0_42125686
  FTP_PASS: ${{ secrets.FTP_PASSWORD || secrets.INFINITYFREE_FTP_PASSWORD || vars.FTP_PASSWORD || vars.INFINITYFREE_FTP_PASSWORD }}

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate FTP Secrets
        run: |
          test -n "$FTP_PASS" || { echo "Missing FTP password. Please add your FTP password to GitHub Secrets."; exit 1; }

      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Show Branch
        run: |
          echo "Branch: $GITHUB_REF"

      - name: Validate FTP Password
        run: |
          test -n "${{ secrets.FTP_PASSWORD }}" || {
            echo "FTP_PASSWORD secret is missing";
            exit 1;
          }

      # 1. DEPLOY TO STAGING (Runs only on push to the 'staging' branch)
      - name: FTP Deploy to Staging
        if: github.ref == 'refs/heads/staging'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ftpupload.net
          username: if0_42125686
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: htdocs/
          exclude: |
            **/.git*
            **/.github/**
            **/node_modules/**
            database/**
            user_guide/**
            user_guide_src/**
            vendor/**
            README.md
            readme.rst
            phpdoc.dist.xml
            composer.json
            composer.lock

      # ✅ STAGING (gicpcstaging.page.gd)
      - name: FTP Deploy to Staging
        if: github.ref == 'refs/heads/tbtayo'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ftpupload.net
          username: if0_42125686
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: /graceinchristpc.online/htdocs/
          exclude: |
            **/.git*
            **/.github/**
            **/node_modules/**
            database/**
            user_guide/**
            user_guide_src/**
            vendor/**
            README.md
            readme.rst
            phpdoc.dist.xml
            composer.json
            composer.lock