name: 🚀 Deploy Staging via FTP

on:
  push:
    branches:
      - staging

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Show Branch
        run: |
          echo "Branch: $GITHUB_REF"

      - name: Validate FTP Password
        run: |
          test -n "${{ secrets.FTP_PASSWORD }}" || {
            echo "FTP_PASSWORD secret is missing";
            exit 1;
          }

      - name: FTP Deploy to Staging
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ftpupload.net
          username: if0_42125686
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: htdocs/
          exclude: |
            **/.git*
            **/.github/**
            **/node_modules/**
            database/**
            user_guide/**
            user_guide_src/**
            vendor/**
            README.md
            readme.rst
            phpdoc.dist.xml
            composer.json
            composer.lock
