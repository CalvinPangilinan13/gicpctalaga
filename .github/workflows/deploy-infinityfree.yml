name: 🚀 Deploy via FTP

on:
  push:
    branches:
      - main
      - staging

env:
  FTP_USER: ${{ secrets.FTP_USERNAME || secrets.INFINITYFREE_FTP_USERNAME }}
  FTP_PASS: ${{ secrets.FTP_PASSWORD || secrets.INFINITYFREE_FTP_PASSWORD }}

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Validate FTP Secrets
        run: |
          test -n "$FTP_USER" || { echo "Missing FTP username. Add FTP_USERNAME or INFINITYFREE_FTP_USERNAME to repository secrets."; exit 1; }
          test -n "$FTP_PASS" || { echo "Missing FTP password. Add FTP_PASSWORD or INFINITYFREE_FTP_PASSWORD to repository secrets."; exit 1; }

      - name: Checkout Repository
        uses: actions/checkout@v5

      # ✅ PRODUCTION / LIVE (gicpctalaga.page.gd)
      - name: FTP Deploy to Live
        if: github.ref == 'refs/heads/main'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ftpupload.net
          username: ${{ env.FTP_USER }}
          password: ${{ env.FTP_PASS }}
          server-dir: htdocs/
          exclude: |
            **/.git*
            **/.github/**
            **/node_modules/**
            database/**
            user_guide/**
            user_guide_src/**
            vendor/**
            README.md
            readme.rst
            phpdoc.dist.xml
            composer.json
            composer.lock

      # ✅ STAGING (gicpcstaging.page.gd)
      - name: FTP Deploy to Staging
        if: github.ref == 'refs/heads/staging'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ftpupload.net
          username: ${{ env.FTP_USER }}
          password: ${{ env.FTP_PASS }}
          server-dir: gicpcstaging.page.gd/htdocs/
          exclude: |
            **/.git*
            **/.github/**
            **/node_modules/**
            database/**
            user_guide/**
            user_guide_src/**
            vendor/**
            README.md
            readme.rst
            phpdoc.dist.xml
            composer.json
            composer.lock