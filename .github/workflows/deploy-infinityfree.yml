name: 🚀 Deploy via FTP

on:
  push:
    branches:
      - main
      - tbtayo

env:
  # Shared Account Credentials from your screenshots
  FTP_USER: if0_42125686
  FTP_PASS: ${{ secrets.FTP_PASSWORD || secrets.INFINITYFREE_FTP_PASSWORD || vars.FTP_PASSWORD || vars.INFINITYFREE_FTP_PASSWORD }}

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Validate FTP Secrets
        run: |
          test -n "$FTP_PASS" || { echo "Missing FTP password. Please add your FTP password to GitHub Secrets."; exit 1; }

      - name: Checkout Repository
        uses: actions/checkout@v5

      # ✅ PRODUCTION / LIVE (gicpctalaga.page.gd)
      - name: FTP Deploy to Live
        if: github.ref == 'refs/heads/main'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ftpupload.net
          username: ${{ env.FTP_USER }}
          password: ${{ env.FTP_PASS }}
          server-dir: htdocs/
          exclude: |
            **/.git*
            **/.github/**
            **/node_modules/**
            database/**
            user_guide/**
            user_guide_src/**
            vendor/**
            README.md
            readme.rst
            phpdoc.dist.xml
            composer.json
            composer.lock

      # ✅ STAGING (gicpcstaging.page.gd)
      - name: FTP Deploy to Staging
        if: github.ref == 'refs/heads/tbtayo'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ftpupload.net
          username: ${{ env.FTP_USER }}
          password: ${{ env.FTP_PASS }}
          server-dir: gicpcstaging.page.gd/htdocs/
          exclude: |
            **/.git*
            **/.github/**
            **/node_modules/**
            database/**
            user_guide/**
            user_guide_src/**
            vendor/**
            README.md
            readme.rst
            phpdoc.dist.xml
            composer.json
            composer.lock